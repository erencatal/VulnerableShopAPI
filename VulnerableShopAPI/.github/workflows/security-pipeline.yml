name: Continuous Security Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start Timer & Restore Dependencies
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          dotnet restore VulnerableShopAPI/VulnerableShopAPI.csproj --use-lock-file
          dotnet build VulnerableShopAPI/VulnerableShopAPI.csproj -c Release

      # LAYER 1: SAST (Static Analysis)
      - name: 2. Run SAST Scan (Semgrep)
        run: |
          pip install semgrep
          semgrep --config p/csharp --config p/security-audit --config p/secrets --json -o semgrep-report.json . || true

      # LAYER 2: SCA (Dependency Scan - Now detects NuGet packages via assets file)
      - name: 3. Run Dependency Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'

      # LAYER 3: DAST (Active Dynamic Scan)
      - name: 4. Build and Start Target Web App (Docker)
        run: |
          docker build -t vulnerable-shop -f VulnerableShopAPI/Dockerfile VulnerableShopAPI
          docker run -d --name target-app -p 8080:8080 vulnerable-shop
          sleep 10

      - name: 5. Run Active DAST Scan (OWASP ZAP Full Scan)
        uses: zaproxy/action-full-scan@v0.10.0
        continue-on-error: true
        with:
          target: 'http://172.17.0.1:8080/swagger/v1/swagger.json'
          cmd_options: '-a -j -m 2'
          allow_issue_writing: false

      - name: Rename ZAP Report & Calculate Overhead
        run: |
          if [ -f report_json.json ]; then mv report_json.json zap-report.json; fi
          END_TIME=$(date +%s)
          echo "TOTAL_PIPELINE_SECONDS=$((END_TIME - START_TIME))" >> $GITHUB_ENV
          echo "Total Security Pipeline Duration: $((END_TIME - START_TIME)) seconds"

      - name: 6. Upload Complete Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: full-security-reports
          path: |
            semgrep-report.json
            trivy-report.json
            zap-report.json

  benchmark-juice-shop:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clone OWASP Juice Shop Source (Shallow)
        run: |
          git clone --depth 1 https://github.com/juice-shop/juice-shop.git target-juiceshop

      # LAYER 1: SAST on Juice Shop
      - name: 2. Run SAST Scan (Semgrep)
        run: |
          pip install semgrep
          semgrep --config p/javascript --config p/security-audit --json -o juiceshop-semgrep.json target-juiceshop/routes || true

      # LAYER 2: SCA on Juice Shop
      - name: 3. Run Dependency Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'target-juiceshop'
          format: 'json'
          output: 'juiceshop-trivy.json'

      # LAYER 3: DAST on Running Juice Shop Container
      - name: 4. Start OWASP Juice Shop Container
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          sleep 15

      - name: 5. Run DAST Scan (OWASP ZAP Baseline)
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://172.17.0.1:3000'
          cmd_options: '-a -j -m 2'
          allow_issue_writing: false

      - name: Rename ZAP Report
        run: |
          if [ -f report_json.json ]; then mv report_json.json juiceshop-zap.json; fi

      - name: 6. Upload Juice Shop Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-security-reports
          path: |
            juiceshop-semgrep.json
            juiceshop-trivy.json
            juiceshop-zap.json
